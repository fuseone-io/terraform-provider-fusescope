name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, deps, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fmt
        if: matrix.check == 'fmt'
        run: |
          out=$(gofmt -s -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "$out"; echo "::error::Go files need gofmt -s."; exit 1; fi
      - name: deps
        if: matrix.check == 'deps'
        run: go mod tidy -diff && go mod verify
      - name: test
        if: matrix.check == 'test'
        run: go test ./...
      - name: build
        if: matrix.check == 'build'
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
